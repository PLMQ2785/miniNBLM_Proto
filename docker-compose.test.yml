# 빠른 통합 테스트에 일회용 PostgreSQL 인스턴스를 제공한다.
services:
  db-test:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: rag_test_db
      POSTGRES_USER: rag_test_user
      POSTGRES_PASSWORD: rag_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U rag_test_user -d rag_test_db"]
      interval: 1s
      timeout: 3s
      retries: 30
