services:
  db-e2e:
    image: pgvector/pgvector:pg17
    network_mode: host
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -p
      - "55433"
    environment:
      POSTGRES_DB: rag_e2e_db
      POSTGRES_USER: rag_e2e_user
      POSTGRES_PASSWORD: rag_e2e_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 55433 -U rag_e2e_user -d rag_e2e_db"]
      interval: 1s
      timeout: 3s
      retries: 30

  api-e2e:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_DEPENDENCY_GROUP: dev
    network_mode: host
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 127.0.0.1 --port 18080
    environment:
      DATABASE_URL: postgresql+psycopg://rag_e2e_user:rag_e2e_password@127.0.0.1:55433/rag_e2e_db
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_BYTES: 52428800
      EMBEDDING_BASE_URL: http://127.0.0.1:8070
      VLLM_BASE_URL: http://127.0.0.1:8010/v1
      VLLM_API_KEY: EMPTY
      VLLM_MODEL: gemma4
      READINESS_TIMEOUT_SECONDS: 3
      BOOTSTRAP_ADMIN_USERNAME: e2e-admin
      BOOTSTRAP_ADMIN_PASSWORD: E2e!Bootstrap2026
    tmpfs:
      - /app/data
    volumes:
      - ./tests:/app/tests:ro
      - ./sample_fall_prevention.pdf:/app/sample_fall_prevention.pdf:ro
    depends_on:
      db-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18080/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
