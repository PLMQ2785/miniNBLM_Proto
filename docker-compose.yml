# API, 데이터베이스, 임베딩, LLM을 역할별 이미지로 분리해 실행한다.
services:
  db:
    image: pgvector/pgvector:pg17
    network_mode: host
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -p
      - ${MININBLM_DB_PORT:-5433}
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${MININBLM_DB_PORT:-5433} -U rag_user -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://rag_user:rag_password@127.0.0.1:${MININBLM_DB_PORT:-5433}/rag_db
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-53477376}
      EMBEDDING_BASE_URL: http://127.0.0.1:8070
      LLM_ENDPOINTS_FILE: /app/config/llm-endpoints.json
      LLM_SECRETS_DIR: /app/data/secrets/llm
      GEMMA4_API_KEY: ${GEMMA4_API_KEY:-EMPTY}
      XAI_API_KEY: ${XAI_API_KEY:-}
      VISION_CAPTION_MODE: ${VISION_CAPTION_MODE:-disabled}
      VISION_CAPTION_DPI: ${VISION_CAPTION_DPI:-144}
      VISION_CAPTION_VERSION: ${VISION_CAPTION_VERSION:-gemma4-page-caption-v1}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-3}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-168}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    # 미러드 WSL에서는 Docker 브리지 포트가 Windows localhost로 전달되지 않는다.
    # 호스트 네트워크로 API를 WSL의 8080 포트에 직접 바인딩한다.
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      embedding:
        condition: service_started

  embedding:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    gpus: all
    network_mode: host
    environment:
      EMBEDDING_MODEL: BAAI/bge-m3
    volumes:
      - hf_cache:/root/.cache/huggingface

  llm:
    build:
      context: .
      dockerfile: Dockerfile.llm
    image: mininblm-vllm:0.25.0-gemma4-unified-quant
    gpus: all
    network_mode: host
    ipc: host
    environment:
      HF_HOME: /root/.cache/huggingface
      # WSL에서 vLLM의 고정 메모리를 켜 Model Runner V2의 UVA 요구를 충족한다.
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    command:
      - /models/gemma4
      - --served-model-name
      - gemma4
      - --dtype
      - bfloat16
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.65}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-4}
      - --limit-mm-per-prompt.image
      - "1"
      - --host
      - 127.0.0.1
      - --port
      - "8010"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ${VLLM_MODEL_PATH:-./google/gemma-4-12B-it-W4A16}:/models/gemma4:ro
    profiles:
      - llm

volumes:
  postgres_data:
  hf_cache:
